# A House Elves elf: what Elf Desk needs to install, set up and run calendar. AGENTS.md says what each field means.
name: calendar
title: Calendar
version: 0.12.1
author: "@phillip-kruger"
description: Puts all your calendars, Gmail, Google Workspace, Office 365, iCloud, any other with an iCal address or .ics file, or the ones Evolution, Thunderbird, Apple Calendar or KOrganizer already keep on this machine, together in one day, week or month view, with every event's details and a link to join each meeting.
main: Calendar.java
config: ~/.config/calendar/config
tools: []

# What it reads and writes, in plain words: the desk shows these before you install it, so they must be true and
# complete. Name every place outside this machine it reaches, and say when it waits for your click.
reads:
  - "Your calendars, through the private iCal addresses you add in its Settings, from the server each address names: Google Calendar (calendar.google.com) for Gmail and Google Workspace, Outlook (outlook.office365.com) for Office 365, iCloud, or any other. And the .ics files on this machine you add there instead, for a calendar that has no such address. It reads nothing else."
  - "The calendars Evolution (and GNOME Calendar), Thunderbird, Apple Calendar or KOrganizer keep on this machine, if you pick one in its Settings: it reads a copy of their files and never changes them. KOrganizer's are in KDE's Akonadi database, which it only reads, through Akonadi's own socket on this machine. When you add one from On this machine there, it also lists the names of the .ics files in your Documents, Downloads and Desktop folders, so you can pick one. When you sign in to Microsoft there, it looks in Evolution's account settings for the app your organisation has Evolution sign in with, so you can use it too."
  - "Your Google calendar through Google's Calendar API (www.googleapis.com), if you sign in to Google in its Settings (at accounts.google.com, which sends your browser back to Calendar on this machine, at 127.0.0.1, for up to 5 minutes), as Thunderbird does. It asks only to read your events and who you are, so it can't change or send anything."
  - "Your Outlook calendar through Microsoft Graph (graph.microsoft.com), if you sign in to Microsoft in its Settings (at login.microsoftonline.com), as Thunderbird and Evolution do. It asks only to read your calendars and who you are, so it can't change or send anything. With an organisation's app that has a return address (as Evolution signs in), Microsoft's pass is the one that app is allowed, which could also change calendars; Calendar still only reads them."
writes:
  - Nothing outside this machine. It saves the events it read in its own folder, so its tab can show them, and the calendars you add or remove in its config file. A Microsoft or Google sign-in is kept in its own folder too, readable only by you, and goes when you remove its calendar.

# Your calendars are a list in its Settings pop-up (ui/calendar.js), as many as you like: the add-calendar and
# remove-calendar actions write them to its config, and the Microsoft app and Google client with them. Only these two are the desk's.
settings:
  - key: WEEKS_AHEAD
    label: Weeks ahead
    help: How far ahead to read your calendars, from 1 to 26 weeks.
    kind: int
    min: 1
    max: 26
    default: "6"
  - key: HIDE_DECLINED
    label: Hide declined meetings
    help: Leave out meetings you've declined, where the calendar says so.
    kind: bool
    default: "true"

commands:
  refresh:
    label: Refresh calendars
    args: [--save]
  dry-run:
    label: Read without saving
    args: []

dry-run: dry-run

# Its tab (and dashboard card), drawn by ui/calendar.js in the desk's sandboxed frame. It reads only what it saved.
tab:
  page: ui/calendar.js
  card: true
  settings: true
refresh:
  command: refresh
  schedule: "Mon..Fri *-*-* 7..18:00"
data: [events]

# Its Settings list of calendars. They change only its own config on this machine: nothing is sent anywhere.
actions:
  calendars:
    label: List your calendars
    args: [--action=calendars]
    ask: false
  add-calendar:
    label: Add calendar
    args: [--action=add]
    ask: false
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
      address: {max: 500, pattern: "(?i)((https|webcal)://[\\x21-\\x7e]{3,490}|(~/|/|file:/)\\P{Cntrl}{0,490}\\.ics)"}
  google-app:
    label: Set the Google client
    args: [--action=google-app]
    ask: false
    params:
      # A Desktop app's client ID and secret from Google Cloud, checked again by the script. No secret keeps the one set.
      app: {max: 120, pattern: "[0-9a-z.-]{10,120}"}
      secret: {max: 100, pattern: "[\\x21-\\x7E]{0,100}"}
  google-sign-in:
    label: Sign in to Google
    confirm: Sign in to Google so Calendar can read your Google calendar? It only reads it.
    args: [--action=google-sign-in]
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
  google-check:
    label: Finish signing in to Google
    args: [--action=google-check]
    ask: false
  microsoft-sign-in:
    label: Sign in to Microsoft
    confirm: Sign in to Microsoft so Calendar can read your Outlook calendar? It only reads it.
    args: [--action=microsoft-sign-in]
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
  microsoft-app:
    label: Set the Microsoft app
    args: [--action=microsoft-app]
    ask: false
    params:
      # The same three as Microsoft app ID, organisation and return address in Settings, checked again by the script.
      app: {max: 36, pattern: "[0-9a-fA-F-]{36}"}
      tenant: {max: 100, pattern: "[A-Za-z0-9.-]{0,100}"}
      redirect: {max: 400, pattern: "(https?://[\\x21-\\x7E]{3,390})?"}
  microsoft-evolution:
    label: Find the Microsoft app Evolution uses
    args: [--action=microsoft-evolution]
    ask: false
  microsoft-check:
    label: Finish signing in to Microsoft
    args: [--action=microsoft-check]
    ask: false
  microsoft-finish:
    label: Finish signing in to Microsoft with where its page landed
    args: [--action=microsoft-finish]
    ask: false
    params:
      # The blank page's address, with Microsoft's one-time code: only good with the key the sign-in kept.
      address: {pattern: "https?://[\\x21-\\x7E]{10,4000}", max: 4100}
  local-calendars:
    label: Find calendars
    args: [--action=local]
    ask: false
  add-local-calendar:
    label: Add calendar
    args: [--action=add-local]
    ask: false
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
      source: {max: 420, pattern: "(evolution|thunderbird|apple|akonadi):[\\w.@+-]{1,200}(/[\\w.@+-]{1,200}){0,2}"}
  remove-calendar:
    label: Remove calendar
    confirm: Remove this calendar? You'll need its iCal address to add it again.
    args: [--action=remove]
    params:
      slot: {kind: int}
