# A House Elves elf: what Elf Desk needs to install, set up and run calendar. AGENTS.md says what each field means.
name: calendar
title: Calendar
version: 0.7.0
author: "@phillip-kruger"
description: Puts all your calendars, Gmail, Google Workspace, Office 365, iCloud, any other with an iCal address or .ics file, or the ones Evolution, Thunderbird or Apple Calendar already keep on this machine, together in one day, week or month view, with every event's details and a link to join each meeting.
main: Calendar.java
config: ~/.config/calendar/config
tools: []

# What it reads and writes, in plain words: the desk shows these before you install it, so they must be true and
# complete. Name every place outside this machine it reaches, and say when it waits for your click.
reads:
  - "Your calendars, through the private iCal addresses you add in its Settings, from the server each address names: Google Calendar (calendar.google.com) for Gmail and Google Workspace, Outlook (outlook.office365.com) for Office 365, iCloud, or any other. And the .ics files on this machine you add there instead, for a calendar that has no such address. It reads nothing else."
  - "The calendars Evolution (and GNOME Calendar), Thunderbird or Apple Calendar keep on this machine, if you pick one in its Settings: it reads a copy of their files and never changes them. When you click Find calendars there, it also lists the names of the .ics files in your Documents, Downloads and Desktop folders, so you can pick one."
  - "Your Outlook calendar through Microsoft Graph (graph.microsoft.com), if you sign in to Microsoft in its Settings (at login.microsoftonline.com), as Thunderbird and Evolution do. It asks only to read your calendars and who you are, so it can't change or send anything. With an organisation's app that has a return address (as Evolution signs in), Microsoft's pass is the one that app is allowed, which could also change calendars; Calendar still only reads them."
writes:
  - Nothing outside this machine. It saves the events it read in its own folder, so its tab can show them, and the calendars you add or remove in its config file. A Microsoft sign-in is kept in its own folder too, readable only by you, and goes when you remove its calendar.

# Your calendars are a list in its Settings pop-up (ui/calendar.js), as many as you like: the add-calendar and
# remove-calendar actions write them to its config. The three addresses at the end are from before that list; the desk
# won't install a version that stops listing a secret, so they stay, last and marked not needed, and show up in the list
# like any other.
settings:
  - key: WEEKS_AHEAD
    label: Weeks ahead
    help: How far ahead to read your calendars, from 1 to 26 weeks.
    kind: int
    min: 1
    max: 26
    default: "6"
  - key: HIDE_DECLINED
    label: Hide declined meetings
    help: Leave out meetings you've declined, where the calendar says so.
    kind: bool
    default: "true"
  - key: MICROSOFT_APP_ID
    label: Microsoft app ID
    help: Only for Sign in to Microsoft, under Online, Microsoft, at the top. The Application (client) ID of an app registered in Microsoft Entra that may read calendars; Calendar's README says how to get one.
    kind: text
    default: ""
    optional: true
  - key: MICROSOFT_TENANT
    label: Microsoft organisation
    help: Only for an app your organisation registered for itself alone. Its Directory (tenant) ID, or its domain. Leave it empty for any account.
    kind: text
    default: ""
    optional: true
  - key: MICROSOFT_REDIRECT
    label: Microsoft return address
    help: Only for an app that won't take a sign-in code, like an organisation's app for Evolution. Its redirect URI, e.g. https://login.microsoftonline.com/common/oauth2/nativeclient. Sign in to Microsoft then gives a link, and you paste the address you land on.
    kind: text
    default: ""
    optional: true
  - key: CAL1_ICS_SECRET
    label: Calendar 1 from the first version (not needed)
    help: Leave this. Add your calendars at the top, under Your calendars, one at a time, as many as you like. Only Calendar's first version used this; if it's set, it's already in your list.
    kind: secret
    optional: true
  - key: CAL2_ICS_SECRET
    label: Calendar 2 from the first version (not needed)
    help: Leave this. Add your calendars at the top, under Your calendars, one at a time, as many as you like. Only Calendar's first version used this; if it's set, it's already in your list.
    kind: secret
    optional: true
  - key: CAL3_ICS_SECRET
    label: Calendar 3 from the first version (not needed)
    help: Leave this. Add your calendars at the top, under Your calendars, one at a time, as many as you like. Only Calendar's first version used this; if it's set, it's already in your list.
    kind: secret
    optional: true

commands:
  refresh:
    label: Refresh calendars
    args: [--save]
  dry-run:
    label: Read without saving
    args: []

dry-run: dry-run

# Its tab (and dashboard card), drawn by ui/calendar.js in the desk's sandboxed frame. It reads only what it saved.
tab:
  page: ui/calendar.js
  card: true
  settings: true
refresh:
  command: refresh
  schedule: "Mon..Fri *-*-* 7..18:00"
data: [events]

# Its Settings list of calendars. They change only its own config on this machine: nothing is sent anywhere.
actions:
  calendars:
    label: List your calendars
    args: [--action=calendars]
    ask: false
  add-calendar:
    label: Add calendar
    args: [--action=add]
    ask: false
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
      address: {max: 500, pattern: "(?i)((https|webcal)://[\\x21-\\x7e]{3,490}|(~/|/|file:/)\\P{Cntrl}{0,490}\\.ics)"}
  microsoft-sign-in:
    label: Sign in to Microsoft
    confirm: Sign in to Microsoft so Calendar can read your Outlook calendar? It only reads it.
    args: [--action=microsoft-sign-in]
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
  microsoft-check:
    label: Finish signing in to Microsoft
    args: [--action=microsoft-check]
    ask: false
  microsoft-finish:
    label: Finish signing in to Microsoft with where its page landed
    args: [--action=microsoft-finish]
    ask: false
    params:
      # The blank page's address, with Microsoft's one-time code: only good with the key the sign-in kept.
      address: {pattern: "https?://[\\x21-\\x7E]{10,4000}", max: 4100}
  local-calendars:
    label: Find calendars
    args: [--action=local]
    ask: false
  add-local-calendar:
    label: Add calendar
    args: [--action=add-local]
    ask: false
    params:
      name: {max: 40, pattern: "[\\p{L}\\p{N} ._'&()+-]{1,40}"}
      source: {max: 420, pattern: "(evolution|thunderbird|apple):[\\w.@+-]{1,200}(/[\\w.@+-]{1,200}){0,2}"}
  remove-calendar:
    label: Remove calendar
    confirm: Remove this calendar? You'll need its iCal address to add it again.
    args: [--action=remove]
    params:
      slot: {kind: int}
